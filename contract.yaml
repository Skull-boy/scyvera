version: 1.1

system:
  name: scyvera
  purpose: >-
    Maintains the Scyvera Agent Contract specification, the Python governance
    runtime, the scyvera-ts conformance runtime, and the scyvera-rs native Rust
    runtime, and publishes both runtime packages to their public registries
    under human approval.
  version: "1.4.0"

domain: software

lifecycle:
  mode: request-response
  initiation: human-only
  resumability: stateless

capabilities:
  - name: publish_runtime_package
    description: >-
      Publishes @scyvera/scyvera-ts to the public npm registry from a
      release-triggered workflow, after the maintainer approves the deployment
      gate.
  - name: verify_package_release
    description: >-
      Checks that the release tag matches the package version and that the
      runtime conforms to the pinned conformance suite before any artifact is
      published.
  - name: publish_native_runtime_package
    description: >-
      Publishes scyvera-rs to the public crates.io registry from a
      release-triggered workflow, after the maintainer approves the deployment
      gate. The bootstrap version is uploaded by the maintainer with a
      short-lived, scoped token, because crates.io requires a token until the
      crate exists; every later version publishes through OIDC.

resources:
  - name: npm_registry
    type: package_registry
    access: write
    scope: "@scyvera/scyvera-ts"
  - name: crates_io_registry
    type: package_registry
    access: write
    scope: "scyvera-rs"

permissions:
  - "registry:publish"

side_effects:
  - type: package_publish
    resource: npm_registry
    description: Publishes an immutable version of @scyvera/scyvera-ts.
    irreversible: true
  - type: package_publish
    resource: crates_io_registry
    description: Publishes an immutable version of scyvera-rs.
    irreversible: true

approvals:
  - action: registry:publish
    required: true
    approver: repository_maintainer

dependencies:
  - name: npm_registry_api
    type: external_api
    required: true
  - name: crates_io_api
    type: external_api
    required: true
  - name: conformance_vectors
    type: internal_artifact
    required: true

recovery:
  strategy: human_escalation
  details: >-
    A failed run stops before publication. A bad published version is deprecated
    and superseded by a fixed patch; published versions are not unpublished.
    crates.io is stricter than npm: a version can be yanked but never deleted,
    so preflight and the approval gate are the only corrections available before
    upload.

replay:
  mode: prohibited
  details: >-
    A published version is immutable, so the workflow is never replayed at the
    same version.

observability:
  level: audit
  sinks:
    - github_actions_log
    - npm_provenance
    - crates_io_attestation

risk:
  level: low
  category: release_management
