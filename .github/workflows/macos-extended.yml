name: macOS extended matrix

# Full macOS coverage lives here, not on pull requests.
#
# The macOS arm64 hosted pool is capacity-constrained: GitHub cancels a job it
# cannot place *before it starts* ("not acquired by Runner of type hosted ...
# internal server error"). That cancellation fails the run, so carrying all five
# macOS minors on every PR meant a green PR could read red for a reason that had
# nothing to do with the code. It hit PR #100 (one job) and PR #102 (two jobs).
#
# Pull requests keep macOS at the floor and the ceiling, because what macOS
# proves is platform behaviour -- paths, case-insensitive APFS by default, NFD
# filenames, symlink and permission semantics -- and that is a property of the
# operating system, not of the interpreter minor. The three minors PRs skip run
# here instead, so no combination in the supported matrix goes untested.
#
# This is not a badge for its own sake: a scheduled run that nobody reads is
# theatre. When it goes red, it means a macOS-only reading of a Python minor
# regression, and it should be triaged like any other failure.

on:
  schedule:
    # 04:17 UTC daily -- off the hour so it does not queue behind every other
    # cron in the world.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a nightly mid-flight: a half-finished matrix is worse than a
# queued one. Manual dispatches queue behind each other for the same reason.
concurrency:
  group: macos-extended
  cancel-in-progress: false

jobs:
  build-and-test:
    name: macOS extended (Python ${{ matrix.python-version }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      # One red minor must not hide the other two.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (pinned 2026-11-06)

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (pinned 2026-11-06)
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest PyGithub qdrant-client

      - name: Run test suite
        run: python -m pytest -v
