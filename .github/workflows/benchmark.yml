name: Performance benchmark

# PD-5: manual-only. Benchmarks on shared runners are noisy, so this workflow
# never gates a pull request; it records a reproducible run on demand and
# uploads the JSON evidence. It writes nothing back to the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Benchmark - synthetic corpora
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (pinned 2026-11-06)

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (pinned 2026-11-06)
        with:
          python-version: "3.12"

      - name: Install scyvera and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run benchmark
        # Corpora are generated in the runner's temp directory and removed after
        # each cell; only the result JSON leaves this step.
        run: |
          python benchmarks/run.py \
            --files 1000,5000,10000,50000 \
            --profiles clean,noisy,governed \
            --repeats 10 \
            --scan-repeats 3 \
            --budget-seconds 1200 \
            --json "benchmarks/results/ci-${GITHUB_RUN_ID}.json"

      - name: Upload result evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2 (pinned 2026-11-06)
        with:
          name: performance-benchmark-${{ github.run_id }}
          path: benchmarks/results/ci-*.json
          if-no-files-found: error
          retention-days: 90
