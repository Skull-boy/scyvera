name: Validate Agent Contracts & Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# A new push to a PR cancels the superseded run for that PR. Without this, two
# matrices (the old commit's and the new one's) queue for the same hosted
# runners, and macOS arm64 is the pool that runs out first. Main is never
# cancelled: every commit on main keeps the result it earned.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: the workflow only reads the repository. No step publishes
# anything or needs a write-scoped token.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Test Package Matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # One failing OS/Python pair must not cancel the remaining combinations,
      # so a PR shows the full support picture in a single run.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # macOS arm64 hosted runners are the constrained pool. GitHub cancels
        # these jobs *before they start* ("not acquired by Runner of type
        # hosted ... internal server error"), which turns a green PR red for a
        # reason that has nothing to do with the code.
        #
        # Interpreter-minor behaviour does not differ between platforms -- a
        # 3.11-only syntax or stdlib regression shows on Linux and Windows too.
        # What macOS actually proves is platform behaviour: paths, case
        # sensitivity, filesystem encoding, process handling. That is a
        # property of the OS, not the minor version, so macOS runs the floor
        # and the ceiling, and the five-version sweep stays on the two pools
        # that have capacity.
        exclude:
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (pinned 2026-11-06)

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (pinned 2026-11-06)
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest PyGithub qdrant-client

      - name: Run test suite
        run: python -m pytest -v

  build-wheel:
    name: Build Wheel & Verify Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (pinned 2026-11-06)

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0 (pinned 2026-11-06)
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest PyYAML jsonschema PyGithub qdrant-client

      - name: Build wheel and source distribution
        run: python -m build

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Run test suite on installed package
        run: python -m pytest -v

      - name: Verify CLI executable
        run: |
          scyvera --help
          scyvera init test_contract.yaml --name "CI System" --domain "software"
          scyvera validate test_contract.yaml
          scyvera lint test_contract.yaml
